name: Build Desktop Buddy (.exe)

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-buddy/**'
      - '.github/workflows/build-desktop-buddy.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-buddy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-buddy/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopBuddy-windows
          path: desktop-buddy/dist/*.exe

name: Montaj Windows

on:
  push:
    branches: [montaj-video-agent]
    paths: ["montaj/**", ".github/workflows/montaj-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Portable Python
        shell: pwsh
        run: |
          $v = "3.12.10"
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip -DestinationPath dist/Montaj/python
          # enable site-packages in the embeddable distribution
          $pth = Get-ChildItem dist/Montaj/python -Filter "python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace "#import site", "import site" | Set-Content $pth.FullName
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          dist/Montaj/python/python.exe get-pip.py --no-warn-script-location
          dist/Montaj/python/python.exe -m pip install --no-warn-script-location -r montaj/requirements.txt segno

      - name: ffmpeg (with libass, vid.stab, NVENC/QSV/AMF)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp
          New-Item -ItemType Directory dist/Montaj/ffmpeg | Out-Null
          Copy-Item fftmp/*/bin/ffmpeg.exe, fftmp/*/bin/ffprobe.exe dist/Montaj/ffmpeg/

      - name: App and launcher
        shell: pwsh
        run: |
          Copy-Item -Recurse montaj dist/Montaj/app
          Remove-Item -Recurse -Force dist/Montaj/app/tests, dist/Montaj/app/packaging -ErrorAction SilentlyContinue
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --console --name Montaj --distpath dist/Montaj montaj/packaging/launcher.py

      - name: Smoke test
        shell: pwsh
        run: |
          $env:MONTAJ_FFMPEG_DIR = "$PWD/dist/Montaj/ffmpeg"
          $env:MONTAJ_NO_BROWSER = "1"
          $env:MONTAJ_WORKSPACE = "$PWD/ws"
          $p = Start-Process dist/Montaj/python/python.exe -ArgumentList "server.py" -WorkingDirectory dist/Montaj/app -PassThru
          Start-Sleep -Seconds 25
          $s = Invoke-RestMethod http://127.0.0.1:8765/api/status
          Write-Host "ffmpeg: $($s.ffmpeg)  whisper: $($s.whisper)  people: $($s.people)  encoder: $($s.encoder)"
          Stop-Process -Id $p.Id -Force
          if (-not $s.ffmpeg) { throw "ffmpeg not found" }

      - uses: actions/upload-artifact@v4
        with:
          name: Montaj-Windows
          path: dist/Montaj
          compression-level: 6

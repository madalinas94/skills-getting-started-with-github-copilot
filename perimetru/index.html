<title>Perimetru</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Lato:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Platinum CPO look: black rooms, platinum-silver type, gold only where a decision is waiting. Layout: a private operations room behind a Riviera arrival. The intro is a helicopter crossing Monaco at dusk; inside, a dark briefing table: radar by date, a country atlas, the contact book, the approval desk, the pipeline and a concierge AI at the side. Champagne marks what needs a decision; claret marks urgency. */
:root {
  --bg: #050506;
  --bg-2: #0C0C0E;
  --surface: #121214;
  --surface-2: #1B1B1E;
  --line: #2B2B30;
  --ink: #F4F4F2;
  --muted: #AEB1B5;
  --faint: #74777C;
  --gold: #F0C23A;
  --gold-ink: #0A0A0A;
  --gold-soft: rgb(240 194 58 / .12);
  --claret: #E0566A;
  --claret-soft: rgb(224 86 106 / .14);
  --amber: #E8A93A;
  --amber-soft: rgb(232 169 58 / .14);
  --sage: #7FC4A0;
  --sage-soft: rgb(127 196 160 / .14);
  --steel: #A9B7C8;
  --steel-soft: rgb(169 183 200 / .14);
  --title-fill: linear-gradient(180deg, #FFFFFF 0%, #D9DCDF 52%, #9EA2A7 100%);
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 18px 40px rgb(0 0 0 / .35);
  --f-display: "Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Lato", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F4F4F2; --bg-2: #EBEBE8; --surface: #FFFFFF; --surface-2: #F0F0EE; --line: #DCDCD8;
    --ink: #0B0B0C; --muted: #55585C; --faint: #85888C;
    --gold: #9A7200; --gold-ink: #FFFFFF; --gold-soft: rgb(154 114 0 / .1);
    --title-fill: linear-gradient(180deg, #0B0B0C, #0B0B0C);
    --mark-filter: brightness(.42) contrast(1.6);
    --claret: #A2283A; --claret-soft: rgb(162 40 58 / .09);
    --amber: #9A6510; --amber-soft: rgb(154 101 16 / .1);
    --sage: #2E7A57; --sage-soft: rgb(46 122 87 / .1);
    --steel: #3F5B80; --steel-soft: rgb(63 91 128 / .1);
    --shadow: 0 1px 2px rgb(40 30 10 / .05), 0 14px 34px rgb(40 30 10 / .08);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F4F4F2; --bg-2: #EBEBE8; --surface: #FFFFFF; --surface-2: #F0F0EE; --line: #DCDCD8;
  --ink: #0B0B0C; --muted: #55585C; --faint: #85888C;
  --gold: #9A7200; --gold-ink: #FFFFFF; --gold-soft: rgb(154 114 0 / .1);
  --title-fill: linear-gradient(180deg, #0B0B0C, #0B0B0C);
  --mark-filter: brightness(.42) contrast(1.6);
  --claret: #A2283A; --claret-soft: rgb(162 40 58 / .09);
  --amber: #9A6510; --amber-soft: rgb(154 101 16 / .1);
  --sage: #2E7A57; --sage-soft: rgb(46 122 87 / .1);
  --steel: #3F5B80; --steel-soft: rgb(63 91 128 / .1);
  --shadow: 0 1px 2px rgb(40 30 10 / .05), 0 14px 34px rgb(40 30 10 / .08);
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--gold); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: .02em; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

/* ---------- Arrival (intro) ---------- */
.arrival { position: fixed; inset: 0; z-index: 80; background: #0B1424; color: #F4ECDD; overflow: hidden; display: grid; }
.arrival svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.arrival .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(8 12 22 / .7) 0%, rgb(8 12 22 / .3) 50%, rgb(8 12 22 / 0) 75%), linear-gradient(0deg, rgb(8 12 22 / .85) 0%, rgb(8 12 22 / .4) 30%, rgb(8 12 22 / 0) 50%); }
.arrival .copy { position: relative; align-self: end; padding-block: 0 calc(56px + env(safe-area-inset-bottom, 0px)); padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 760px; display: grid; gap: 14px; }
.arrival .coords { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase; color: #C9CCD0; }
.arrival h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(40px, 8.5vw, 96px); letter-spacing: .16em; background: linear-gradient(180deg, #FFFFFF 0%, #DADDE0 55%, #A3A7AC 100%); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: .95; margin: 0; }
.arrival h1 em { font-family: var(--f-body); font-style: italic; font-weight: 400; letter-spacing: .02em; font-size: .36em; display: block; color: #F0C23A; -webkit-text-fill-color: #F0C23A; margin-top: 12px; }
.arrival p { margin: 0; font-size: 15.5px; color: #D6D8DB; max-width: 52ch; }
.arrival .row { margin-top: 8px; }
.enter { background: #F0C23A; color: #0A0A0A; border: 0; border-radius: 999px; padding: 14px 30px; font-weight: 700; font-size: 14.5px; letter-spacing: .06em; cursor: pointer; box-shadow: 0 10px 40px rgb(240 194 58 / .25); }
.enter:hover { filter: brightness(1.06); }
.arrival .fine { font-size: 12px; color: #A3A7AC; }
.arrival.leaving { animation: leave .7s ease forwards; }
@keyframes leave { to { opacity: 0; transform: scale(1.03); visibility: hidden; } }
.heli { animation: fly 16s linear infinite; }
.heli-bob { animation: bob 2.4s ease-in-out infinite; }
.rotor { transform-box: fill-box; transform-origin: center; animation: spin .11s linear infinite; }
.tail-rotor { transform-box: fill-box; transform-origin: center; animation: spin2 .08s linear infinite; }
.navlight { animation: blink 1.1s steps(2) infinite; }
.twinkle { animation: tw 3.2s ease-in-out infinite; }
.twinkle:nth-child(3n) { animation-delay: -1.1s; } .twinkle:nth-child(4n) { animation-delay: -2.2s; }
.shimmer { animation: sh 2.6s ease-in-out infinite; } .shimmer:nth-child(2n) { animation-delay: -1.3s; }
.yacht { animation: bob 5s ease-in-out infinite; }
@keyframes fly { from { transform: translate(1750px, 210px); } 50% { transform: translate(760px, 170px); } to { transform: translate(-320px, 120px); } }
@keyframes bob { 50% { transform: translateY(5px); } }
@keyframes spin { 50% { transform: scaleX(.12); } }
@keyframes spin2 { 50% { transform: scaleY(.15); } }
@keyframes blink { 50% { opacity: .1; } }
@keyframes tw { 50% { opacity: .35; } }
@keyframes sh { 50% { opacity: .25; transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .heli { animation: none; transform: translate(900px, 170px); } .heli-bob, .rotor, .tail-rotor, .navlight, .twinkle, .shimmer, .yacht { animation: none; } .arrival.leaving { animation-duration: .01s; } }

/* ---------- Header ---------- */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 18px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; filter: var(--mark-filter, none); }
.brand-name { display: block; font-family: var(--f-display); font-size: 20px; letter-spacing: .24em; font-weight: 600; line-height: 1; background: var(--title-fill); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-sub { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { border-color: var(--gold); }
.badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--claret); color: #fff; font: 600 10px/18px var(--f-mono); text-align: center; }
.search { flex: 1 1 260px; max-width: 360px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; }
.search input { border: 0; background: transparent; outline: none; width: 100%; min-width: 0; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; padding: 7px 13px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 13px; display: inline-flex; gap: 7px; align-items: center; }
nav.tabs a:hover { color: var(--ink); text-decoration: none; background: var(--surface); }
nav.tabs a[aria-current="page"] { color: var(--gold-ink); background: var(--gold); }
nav.tabs .count { font-family: var(--f-mono); font-size: 11px; opacity: .8; }
nav.subnav { padding-top: 0; }
nav.subnav a { font-size: 12.5px; padding: 5px 11px; }
nav.subnav a[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
@media (max-width: 720px) { .search { display: none; } .brand-sub { display: none; } }

main { padding-block: 28px 110px; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; margin-bottom: 22px; }
.view-head h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.1; background: var(--title-fill); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 6px 0 0; text-wrap: balance; letter-spacing: -.01em; }
.view-head p { margin: 8px 0 0; color: var(--muted); max-width: 66ch; }
.view-head .grow { flex: 1 1 380px; min-width: 0; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-bottom: 26px; overflow: hidden; }
.kpi { padding: 16px 18px; border-left: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-top: 0; border-right: 0; border-bottom: 0; }
.kpi:first-child { border-left: 0; }
.kpi:hover { background: var(--surface-2); }
.kpi .n { font-family: var(--f-display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
.kpi .l { margin-top: 6px; color: var(--muted); font-size: 12.5px; }
.kpi.hot .n { color: var(--claret); }
.kpi.gold .n { color: var(--gold); }
h2.sec { font-family: var(--f-display); font-weight: 600; letter-spacing: -.01em; font-size: 24px; margin: 28px 0 12px; }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi:nth-child(3) { border-left: 0; } .kpi:nth-child(n+3) { border-top: 1px solid var(--line); } }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filters .lab { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-right: 4px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { color: var(--ink); border-color: var(--faint); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); background: var(--gold-soft); }
.select { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; max-width: 100%; }

/* Timeline */
.month { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 0 24px; margin-bottom: 8px; margin-top: 12px; }
.month-label { position: sticky; top: 130px; align-self: start; padding-top: 18px; }
.month-label .m { font-family: var(--f-display); font-size: 24px; font-weight: 600; line-height: 1; }
.month-label .y { font-family: var(--f-mono); font-size: 11px; color: var(--faint); letter-spacing: .14em; margin-top: 4px; }
.month-items { border-left: 1px solid var(--line); padding-left: 24px; display: grid; gap: 14px; padding-block: 14px; }
@media (max-width: 720px) { .month { grid-template-columns: minmax(0, 1fr); } .month-label { position: static; padding: 8px 0 0; } .month-items { border-left: 0; padding-left: 0; } }

.ev { position: relative; display: grid; grid-template-columns: 74px minmax(0, 1fr) 210px; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.ev::before { content: ""; position: absolute; left: -29px; top: 28px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2px solid var(--gold); }
.ev.t1::before { background: var(--claret); border-color: var(--claret); }
@media (max-width: 720px) { .ev::before { display: none; } }
.ev-date { text-align: center; border-right: 1px solid var(--line); padding-right: 14px; }
.ev-date .d { font-family: var(--f-display); font-size: 36px; line-height: 1; font-variant-numeric: lining-nums; }
.ev-date .r { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
.ev-date .cc { margin-top: 8px; display: inline-block; font: 500 11px var(--f-mono); letter-spacing: .1em; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--muted); }
.ev-body { min-width: 0; }
.ev-title { font-family: var(--f-display); font-size: 21px; font-weight: 500; line-height: 1.2; margin: 4px 0 4px; text-wrap: balance; }
.ev-where { color: var(--muted); font-size: 13px; }
.ev-angle { margin: 10px 0 0; font-size: 13.5px; max-width: 70ch; }
.ev-targets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); color: var(--muted); border: 1px solid transparent; }
.tag.need { background: transparent; border-color: var(--line); }
button.tag { cursor: pointer; }
button.tag:hover { border-color: var(--gold); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--f-mono); letter-spacing: .04em; padding: 5px 8px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--sage); background: var(--sage-soft); }
.pill.warn { color: var(--amber); background: var(--amber-soft); }
.pill.hot { color: var(--claret); background: var(--claret-soft); }
.pill.info { color: var(--steel); background: var(--steel-soft); }
.pill.gold { color: var(--gold); background: var(--gold-soft); }
.ev-side { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; border-left: 1px solid var(--line); padding-left: 16px; min-width: 0; }
.advance { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); line-height: 1.6; }
.advance b { color: var(--ink); font-weight: 500; }
.sources { display: flex; flex-direction: column; gap: 2px; font-size: 12px; min-width: 0; width: 100%; }
.sources a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; display: block; }
@media (max-width: 900px) { .ev { grid-template-columns: 64px minmax(0, 1fr); } .ev-side { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 12px; flex-direction: row; flex-wrap: wrap; align-items: center; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; padding: 9px 14px; font-weight: 700; font-size: 13px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; white-space: nowrap; color: var(--ink); }
.btn:hover { border-color: var(--faint); text-decoration: none; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--claret); background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Countries */
.atlas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.country { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; }
.country:hover { border-color: var(--gold); }
.country[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); }
.country .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.country .nm { font-family: var(--f-display); font-size: 19px; }
.country .n { font-family: var(--f-display); font-size: 26px; color: var(--gold); font-variant-numeric: lining-nums; }
.country .nx { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.country .cc2 { font: 500 10.5px var(--f-mono); letter-spacing: .14em; color: var(--faint); }
.region-h { margin: 22px 0 10px; }

/* Leads */
.leads { display: grid; gap: 12px; }
.lead { display: grid; grid-template-columns: 58px minmax(0, 1.3fr) minmax(0, 1fr) 190px; gap: 18px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.score { width: 52px; height: 52px; position: relative; }
.score svg { display: block; }
.score span { position: absolute; inset: 0; display: grid; place-items: center; font: 500 14px var(--f-mono); }
.lead h3 { font-family: var(--f-display); font-weight: 600; font-size: 20px; margin: 2px 0 2px; line-height: 1.2; }
.lead .why { margin: 8px 0 0; font-size: 13.5px; }
.lead .meta { font-size: 12.5px; color: var(--muted); display: grid; gap: 8px; min-width: 0; }
.lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.lead-actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.lead-actions select { width: 100%; }
@media (max-width: 1000px) { .lead { grid-template-columns: 52px minmax(0, 1fr); } .lead .meta, .lead-actions { grid-column: 2 / -1; } .lead-actions { flex-direction: row; flex-wrap: wrap; } .lead-actions select { width: auto; } }
@media (max-width: 520px) { .lead { grid-template-columns: minmax(0, 1fr); } .lead .meta, .lead-actions { grid-column: 1; } }
.rolelinks { display: flex; flex-wrap: wrap; gap: 4px 10px; }

/* Contacts */
.contacts { display: grid; gap: 10px; }
.ct { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.1fr) auto; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.ct .nm { font-weight: 700; }
.ct .rl { font-size: 12.5px; color: var(--muted); }
.ct .ch { display: grid; gap: 3px; min-width: 0; }
.ct .ch .mono { overflow-wrap: anywhere; }
@media (max-width: 900px) { .ct { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
.copy { border: 0; background: none; color: var(--gold); cursor: pointer; font-size: 11.5px; font-weight: 700; padding: 0 0 0 6px; }
.find { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-bottom: 26px; }
.find a { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.find a:hover { border-color: var(--gold); text-decoration: none; }
.find a span { font-size: 12px; color: var(--muted); }
.find a b { font-weight: 700; }

/* Outreach */
.subtabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.subtabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.drafts { display: grid; gap: 16px; }
.draft { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.draft-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
.draft-head h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.draft-body { padding: 16px 18px; display: grid; gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.field input, .field textarea, .field select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-width: 0; }
.field textarea { min-height: 220px; resize: vertical; line-height: 1.55; font-size: 13.5px; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--gold); outline: none; }
.draft-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 18px 16px; }
.draft-foot .spacer { flex: 1; }
.note { font-size: 12.5px; color: var(--muted); }
.ctx { font-size: 12.5px; color: var(--muted); padding: 10px 12px; border-radius: 8px; background: var(--gold-soft); }

/* Pipeline */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-height: 160px; }
.col h4 { margin: 0 0 10px; display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: var(--f-mono); font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: grid; gap: 6px; }
.card .t { font-weight: 700; font-size: 13.5px; }
.card .s { font-size: 12px; color: var(--muted); }
.card select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
.followups { margin-bottom: 22px; }
.fu { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-bottom: 8px; }
.fu .t { font-weight: 700; flex: 1 1 220px; min-width: 0; }

/* Services */
.services { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.svc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 8px; align-content: start; }
.svc h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 20px; }
.svc .k { font: 500 10.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.svc p { margin: 0; font-size: 13.5px; color: var(--muted); }
.svc .partners { font-size: 12.5px; }

/* Alerts */
.alerts { display: grid; gap: 10px; max-width: 860px; }
.alert { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.alert .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--faint); }
.alert.unread .dot { background: var(--claret); box-shadow: 0 0 0 4px var(--claret-soft); }
.alert .t { font-weight: 700; }
.alert .x { font-size: 13px; color: var(--muted); margin-top: 2px; }
@media (max-width: 560px) { .alert { grid-template-columns: 10px minmax(0, 1fr); } .alert > .row { grid-column: 2; } }

/* Settings */
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; max-width: 860px; }
.settings .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .settings { grid-template-columns: minmax(0, 1fr); } }
.panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 18px; max-width: 860px; margin-top: 22px; }
.panel h3 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 600; font-size: 19px; }
.panel ul { margin: 0; padding-left: 18px; color: var(--muted); }
.panel li { margin: 4px 0; }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 36px 24px; text-align: center; color: var(--muted); }
.empty h3 { font-family: var(--f-display); font-weight: 600; font-size: 22px; color: var(--ink); margin: 0 0 6px; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; z-index: 90; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .55); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { width: min(640px, 100%); max-height: 90vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); }
.modal h2 { font-family: var(--f-display); font-weight: 600; margin: 0 0 4px; font-size: 24px; }
.modal .grid { display: grid; gap: 12px; margin-top: 16px; }

/* Concierge AI */
.ai-fab { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px 12px 14px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); border: 0; font-weight: 700; cursor: pointer; box-shadow: 0 14px 40px rgb(0 0 0 / .35); }
.ai-fab:hover { filter: brightness(1.05); }
.ai-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); z-index: 70; background: var(--bg-2); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; box-shadow: -20px 0 60px rgb(0 0 0 / .35); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.ai-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.ai-head h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 21px; }
.ai-head .x { margin-left: auto; }
.ai-log { overflow-y: auto; padding: 16px 18px; display: grid; gap: 12px; align-content: start; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
.msg.u { justify-self: end; background: var(--gold); color: var(--gold-ink); border-bottom-right-radius: 4px; }
.msg.a { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.a p { margin: 0 0 8px; } .msg.a p:last-child { margin: 0; }
.msg.a ul { margin: 4px 0 8px; padding-left: 18px; }
.msg.s { justify-self: start; font-family: var(--f-mono); font-size: 11px; color: var(--faint); padding: 0 4px; }
.ai-suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.ai-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 12px 14px 16px; border-top: 1px solid var(--line); }
.ai-form textarea { resize: none; min-height: 46px; max-height: 140px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.ai-form textarea:focus { outline: none; border-color: var(--gold); }

.brief { display: grid; gap: 10px; }
.act { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }

@media (max-width: 600px) { .act { grid-template-columns: 30px minmax(0, 1fr); } .act > .row { grid-column: 2; } }
.bars { display: grid; gap: 9px; }

.bar .track { height: 12px; position: relative; border-left: 1px solid var(--line); }

.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.intel { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px 18px; margin-bottom: 18px; display: grid; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.check input[type=checkbox] { margin-top: 3px; }
.logo-img { max-height: 34px; max-width: 130px; object-fit: contain; }
.dossier h4 { margin: 18px 0 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
.modal.wide { width: min(880px, 100%); }

  function evCard(e) {
    const d = parseD(e.start), n = daysTo(e.start);
    const adv = addDays(d, -(e.advanceDays || 21));
    const advN = Math.round((adv - today()) / 864e5);
    const conf = e.confidence === "confirmat" ? `<span class="pill ok">confirmat</span>` : `<span class="pill warn">de reconfirmat</span>`;
    const urgency = n <= 0 ? `<span class="pill hot">în desfășurare</span>` : n <= 30 ? `<span class="pill hot">T-${n} zile</span>` : `<span class="pill info">T-${n} zile</span>`;
    const targets = (e.targets || []).map(orgById).filter(Boolean).map(o => `<button class="tag" data-act="open-org" data-id="${esc(o.id)}">${esc(o.name)}</button>`).join("");
    const needs = (e.needs || []).map(k => `<span class="tag need">${esc(NEEDS[k] || k)}</span>`).join("");
    const src = (e.sources || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">↗ ${esc(s.label)}</a>`).join("");
    return `<article class="ev ${e.tier === 1 ? "t1" : ""}" id="ev-${esc(e.id)}">
      <div class="ev-date"><div class="d">${d.getDate()}</div><div class="r">${esc(range(e.start, e.end))}</div>${e.cc ? `<button class="cc tag" style="background:none" data-act="open-cc" data-id="${esc(e.cc)}" title="${esc(ccName(e.cc))}">${esc(e.cc)}</button>` : ""}</div>
      <div class="ev-body">
        <div class="eyebrow">${esc(CATS[catOf(e)] || catOf(e))} · ${opCode(e)}</div>
        <h3 class="ev-title">${esc(e.title)}</h3>
        <div class="ev-where">${esc([e.venue, e.city, evCountry(e)].filter(Boolean).join(" · "))}</div>
        <p class="ev-angle">${esc(S.lang === "en" && e.angle_en ? e.angle_en : e.angle)}</p>
        ${needs ? `<div class="ev-targets">${needs}</div>` : ""}
        ${targets ? `<div class="ev-targets"><span class="eyebrow">Cui scriem</span>${targets}</div>` : ""}
      </div>
      <div class="ev-side">
        <div class="row">${urgency}${conf}</div>
        <div class="advance">Advance: <b>${advN > 0 ? fmtD(iso(adv)) : "acum"}</b><br>${advN > 0 ? `peste ${advN} zile` : "fereastra e deschisă"}${e.verified ? `<br>verificat ${esc(fmtD(e.verified))}` : ""}</div>

  function viewCountries() {
    const uc = usedCountries();
    const sel = S.f.cc !== "all" ? S.f.cc : null;
    const regionOrder = ["romania", "riviera", "alps", "europe", "gulf", "us", "asia", "africa"];
    const pendingScan = S.requests.filter(r => r.kind === "scanare" && r.status !== "rezolvat" && daysTo((r.createdAt || "").slice(0, 10)) >= -1);
    const card = (cc) => {
      const evs = uc[cc] || []; const nx = [...evs].sort((a, b) => a.start.localeCompare(b.start))[0];
      const ci = S.countryintel.find(x => x.id === cc);
      return `<button class="country" data-act="open-cc" data-id="${cc}" aria-pressed="${sel === cc}"><div class="top"><span class="nm">${esc(ccName(cc))}</span><span class="n">${evs.length}</span></div><span class="cc2">${cc}${ci ? ` · nivel ${ci.level}` : ""}</span><span class="nx">${nx ? `Următorul: ${esc(fmtD(nx.start))} · ${esc(nx.title)}` : "Fără evenimente încă"}</span></button>`;
    };
    const allCcs = (r) => { const set = new Set(WORLD[r].split(" ")); Object.keys(uc).forEach(cc => { if ((REGION_OF[cc] || uc[cc][0]?.region) === r) set.add(cc); }); return [...set]; };
    const atlas = regionOrder.map(r => {
      const ccs = allCcs(r); const withEv = ccs.filter(cc => uc[cc]).sort((a, b) => uc[b].length - uc[a].length); const without = ccs.filter(cc => !uc[cc]).sort((a, b) => ccName(a).localeCompare(ccName(b), "ro"));
      return `<div class="row region-h" style="justify-content:space-between"><span class="eyebrow">${esc(REGIONS[r])} · ${withEv.length} din ${ccs.length} țări cu evenimente</span>${without.length ? `<button class="btn ghost sm" data-act="scan-region" data-id="${r}">Scanează regiunea</button>` : ""}</div>
        ${withEv.length ? `<div class="atlas">${withEv.map(card).join("")}</div>` : ""}
        ${without.length ? `<div class="filters" style="margin-top:10px">${without.map(cc => `<button class="chip" data-act="open-cc" data-id="${cc}">${esc(ccName(cc))}</button>`).join("")}</div>` : ""}`;
    }).join("");
    const evs = sel ? filteredEvents({ cc: sel, horizon: 400 }) : [];
    const ctsHere = sel ? S.contacts.filter(c => c.cc === sel || (orgById(c.orgId)?.cc === sel)) : [];
    const total = Object.values(WORLD).join(" ").split(" ").length;
    return `
      <div class="view-head"><div class="grow">
        <div class="eyebrow">Atlas · ${Object.keys(uc).length} din ${total} țări cu evenimente</div>
        <h1>${sel ? esc(ccName(sel)) : "Toate țările lumii"}</h1>
        <p>${sel ? `${evs.length} evenimente în ${esc(ccName(sel))}${ctsHere.length ? ` și ${ctsHere.length} contacte locale` : ""}. Scanarea caută pe internet evenimente, companii și contacte noi pentru această țară.` : "Fiecare țară, grupată pe regiuni. Cele fără evenimente încă pot fi scanate acum: scanarea intră într-o coadă care rulează automat, pe rând, și rezultatele apar aici pe măsură ce sunt gata."}</p>
      </div>${sel ? `<div class="row"><button class="btn primary" data-act="scan-cc" data-id="${sel}">Scanează ${esc(ccName(sel))} pe internet</button><button class="btn" data-act="open-cc" data-id="all">Toate țările</button></div>` : ""}</div>
      ${pendingScan.length ? `<div class="ctx" style="margin-bottom:16px">${pendingScan.length} ${pendingScan.length === 1 ? "scanare în curs" : "scanări în curs"}: ${esc(pendingScan.map(r => (r.question.match(/region=([^.]+)/) || [])[1] || "").filter(Boolean).join(" · "))}</div>` : ""}
      ${!S.ready ? emptyLoading() : sel ? `${intelBlock(sel)}${evs.length ? eventFilters({ showCountry: false }) + timeline(evs) : `<div class="empty"><h3>Niciun eveniment încă în ${esc(ccName(sel))}</h3><p>Apasă „Scanează” și radarul caută acum pe internet.</p></div>`}` : atlas}`;
  }

  function intelBlock(cc) {
    const ci = S.countryintel.find(x => x.id === cc);

    const cls = { 1: "ok", 2: "info", 3: "warn", 4: "hot" }[ci.level] || "info";
    return `<div class="intel"><div class="row"><span class="lbl">Situația de securitate</span><span class="pill ${cls}">${esc(CI_LEVEL[ci.level] || "")}</span><span class="note">actualizat ${esc(fmtD(ci.updated))}</span></div><div>${esc(ci.summary)}</div>${ci.salesAngle ? `<div class="ctx">${esc(ci.salesAngle)}</div>` : ""}<div class="sources">${(ci.sources || []).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">↗ ${esc(x.label)}</a>`).join("")}</div></div>`;

  function todayActions() {
    const acts = [];
    dueFollowUps().forEach(d => { const o = orgById(d.orgId); acts.push({ w: 100, t: `Follow-up: ${o?.name || ""}`, x: `E-mailul din ${fmtD(d.sentAt)} n-a primit răspuns. Follow-up-ul e gata de scris.`, btn: ["followup", d.id, "Scrie follow-up"] }); });
    const appr = S.drafts.filter(d => d.status === "aprobat");
    if (appr.length) acts.push({ w: 95, t: `${appr.length} e-mailuri aprobate, încă netrimise`, x: "Deschide-le în Gmail sau Outlook și apasă „Am trimis”.", go: "approvals", sub: "aprobat", label: "Trimite" });
    const pend = S.drafts.filter(d => d.status === "de_aprobat");
    if (pend.length) acts.push({ w: 90, t: `${pend.length} e-mailuri așteaptă aprobarea`, x: [...new Set(pend.map(d => orgById(d.orgId)?.name).filter(Boolean))].slice(0, 4).join(", "), go: "approvals", sub: "de_aprobat", label: "Aprobă" });
    S.events.filter(live).forEach(e => {
      const adv = daysTo(iso(addDays(parseD(e.start), -(e.advanceDays || 21))));
      if (adv <= 7 && daysTo(e.start) > 0 && !S.drafts.some(d => d.eventId === e.id))
        acts.push({ w: 80 - Math.max(adv, 0) + (e.tier === 1 ? 10 : 0), t: `Fereastra de advance: ${e.title}`, x: `${fmtD(e.start)} · ${e.city}, ${evCountry(e)}. ${adv <= 0 ? "Fereastra e deschisă" : `Se deschide în ${adv} zile`} și nu e niciun e-mail pregătit.`, btn: ["draft-event", e.id, "Pregătește outreach"] });
    });
    postsDue().slice(0, 1).forEach(p => acts.push({ w: 92, t: daysTo(p.scheduledFor) < 0 ? "Postare LinkedIn întârziată" : "Postarea LinkedIn de azi", x: `${p.topic || "Postare"} · ${CHANNEL[p.channel] || CHANNEL.personal}`, go: "content", label: "Publică" }));
    const rd = refsDue();
    if (rd.length) acts.push({ w: 86, t: `Cereți o recomandare: ${rd.slice(0, 2).map(r => r.name).join(", ")}${rd.length > 2 ? ` și încă ${rd.length - 2}` : ""}`, x: "Oamenii care v-au văzut lucrând sunt cea mai bună sursă de clienți noi.", go: "referrals", label: "Vezi" });
    const oppsSoon = S.opps.filter(o => (o.stage || "nou") === "nou" && o.deadline && daysTo(o.deadline) >= 0 && daysTo(o.deadline) <= 7);
    if (oppsSoon.length) acts.push({ w: 88, t: `${oppsSoon.length} oportunități expiră în 7 zile`, x: oppsSoon.slice(0, 3).map(o => `${o.title} (${fmtD(o.deadline)})`).join(" · "), go: "opps", label: "Vezi" });
    const oppsNew = S.opps.filter(o => (o.stage || "nou") === "nou" && o.found && daysTo(o.found.slice(0, 10)) >= -2);
    if (oppsNew.length) acts.push({ w: 72, t: `${oppsNew.length} oportunități noi`, x: oppsNew.slice(0, 3).map(o => o.title).join(" · "), go: "opps", label: "Vezi" });
    const newSig = S.signals.filter(s => s.found && daysTo(s.found) >= -3);
    if (newSig.length) acts.push({ w: 70, t: `${newSig.length} semnale noi de cerere`, x: newSig.slice(0, 2).map(s => s.title).join(" · "), go: "signals", label: "Vezi" });
    S.orgs.filter(o => (o.status || "nou") === "nou" && !o.dnc && (o.score || 0) >= 80 && S.contacts.some(c => c.orgId === o.id && c.email))
      .forEach(o => acts.push({ w: 50 + (o.score || 0) / 10, t: `Țintă cu contact, încă necontactată: ${o.name}`, x: o.why, btn: ["draft-org", o.id, "Pregătește e-mail"] }));
    return acts.sort((a, b) => b.w - a.w);
  }
  function viewToday() {

      const { text } = await sample(`Ești consilierul comercial al unei firme de close protection și servicii private de lux. Scrie în ${S.lang === "en" ? "engleză" : "română"} un briefing de dimineață de maximum 140 de cuvinte: ce contează azi, în ce ordine, și o singură recomandare strategică pentru săptămâna asta. Fără introduceri. Folosește doar datele de mai jos.\n\nAcțiuni calculate:\n${acts}\n\nEvenimente în 60 de zile:\n${ev}\n\nPipeline: ${stages}. Drafturi de aprobat: ${S.drafts.filter(d => d.status === "de_aprobat").length}.`, { modelTier: "default", onText: ({ text }) => { box.innerHTML = `<div class="ctx" style="margin-bottom:16px">${md(text)}</div>`; } });
      box.innerHTML = `<div class="ctx" style="margin-bottom:16px">${md(text)}</div>`;
    } catch (err) { box.innerHTML = `<div class="note" style="margin-bottom:16px">${err?.code === "not_granted" ? "AI-ul are nevoie de acordul tău." : "Briefingul nu a putut fi scris acum."}</div>`; }

  // ---------- Cereri primite ----------
  const INB_STATUS = ["nou", "în lucru", "ofertă trimisă", "câștigat", "pierdut"];

    const list = [...S.inbound].sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")).filter(i => matchesQ(i.name, i.company, i.summary, i.need, i.where));

  function openInbound() {

  function openMission(m, preset = {}) {
    const isNew = !m;
    m = m || { title: preset.title || "", orgId: preset.orgId || "", eventId: preset.eventId || "", start: "", end: "", cc: preset.cc || "", team: "", status: "planificată", hotels: "", routes: "", local: "", notes: preset.notes || "", report: "", checklist: DEFAULT_CHECK.map(t => ({ t, done: false })), inboundId: preset.inboundId || "" };
    const orgOpts = `<option value="">—</option>` + [...S.orgs].sort((a, b) => a.name.localeCompare(b.name, "ro")).map(o => `<option value="${esc(o.id)}" ${o.id === m.orgId ? "selected" : ""}>${esc(o.name)}</option>`).join("");
    const evOpts = `<option value="">—</option>` + S.events.filter(live).sort((a, b) => a.start.localeCompare(b.start)).map(e => `<option value="${esc(e.id)}" ${e.id === m.eventId ? "selected" : ""}>${esc(fmtD(e.start))} · ${esc(e.title)}</option>`).join("");

          <div class="row" style="margin-top:8px"><input id="mi-newcheck" class="select" style="flex:1;border-radius:8px" placeholder="Adaugă un punct"><button class="btn sm" type="button" id="mi-addcheck">Adaugă</button></div></div>

  // ---------- Parteneri & comisioane ----------
  const DEAL_STATUS = ["propus", "confirmat", "facturat", "comision încasat"];
  const eur = (n) => `${Math.round(+n || 0).toLocaleString("ro-RO")} €`;
  function viewPartners() {
    const commission = (d) => (+d.value || 0) * (+d.commission || 0) / 100;
    const rows = S.partners.map(p => { const ds = S.deals.filter(d => d.partnerId === p.id); return { p, n: ds.length, value: ds.reduce((s, d) => s + (+d.value || 0), 0), com: ds.reduce((s, d) => s + commission(d), 0) }; }).sort((a, b) => b.com - a.com);
    const tot = S.deals.reduce((s, d) => s + commission(d), 0), cashed = S.deals.filter(d => d.status === "comision încasat").reduce((s, d) => s + commission(d), 0);

    const maxSvc = Math.max(1, ...Object.values(bySvc));

      ${!S.ready ? emptyLoading() : !S.partners.length ? `<div class="empty"><h3>Niciun partener încă</h3><p>Adaugă partenerii cu care lucrați și comisionul convenit.</p></div>` : `
      <div class="statgrid">
        <div class="panel" style="margin:0;max-width:none"><h3>Parteneri</h3><div class="contacts">${rows.map(r => `<div class="ct" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto"><div style="min-width:0"><div class="nm">${esc(r.p.name)}</div><div class="rl">${esc(r.p.service || "")} · comision ${esc(r.p.commission || 0)}%</div>${r.p.contact ? `<div class="mono muted" style="overflow-wrap:anywhere">${esc(r.p.contact)}</div>` : ""}</div><div class="ch"><span class="mono">${r.n} vânzări · ${eur(r.value)}</span><span class="mono" style="color:var(--gold)">${eur(r.com)} comision</span></div><div class="row"><button class="btn ghost sm" data-act="edit-partner" data-id="${esc(r.p.id)}">Editează</button></div></div>`).join("")}</div></div>
        <div class="panel" style="margin:0;max-width:none"><h3>Valoare vândută pe serviciu</h3>${Object.keys(bySvc).length ? `<div class="bars">${Object.entries(bySvc).sort((a, b) => b[1] - a[1]).map(([k, v]) => barRow(k, v / maxSvc, eur(v))).join("")}</div>` : `<p class="note">Apare după prima vânzare.</p>`}</div>

Rules: English; 120-200 words; first line is a short hook that makes people click "see more"; short paragraphs; calm senior voice; no client names or identifiable clients; no fear-mongering; no emojis; end with a question or a soft invitation to message; at most 3 relevant hashtags at the end. Suggest a photo of the kind a close protection team would have (team at a red carpet, luxury car arrival, training) without naming people. firstComment: one line with ${c.website || "the company website"}.

  async function celebDraft(c, r) {

  async function drawMap(counts) {
    const box = document.getElementById("worldMap"); if (!box) return;
    try { await mapReady(); } catch (e) { box.innerHTML = `<p class="note" style="padding:20px">Harta nu s-a putut încărca. Lista de țări de mai jos funcționează.</p>`; return; }

    const width = 960, height = 480;

    const byNum = new Map(land.features.map(f => [f.id, f]));
    const proj = d3.geoNaturalEarth1().fitSize([width, height], { type: "Sphere" }), path = d3.geoPath(proj);
    const pos = (cc) => { const n = W.iso2num[cc]; if (n && byNum.get(n)) return proj(d3.geoCentroid(byNum.get(n))); const sm = W.small[cc]; return sm ? proj([sm[1], sm[0]]) : null; };

  // ---------- Calendar (.ics) pentru telefon ----------
  function icsEscape(t) { return String(t || "").replace(/\\/g, "\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\r?\n/g, "\\n"); }
  function icsDate(d) { return d.replace(/-/g, ""); }
  async function exportCalendar() {
    if (!downloads) { toast("Descărcarea nu e disponibilă aici."); return; }
    const L = [], stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
    const ev = (uid, start, end, title, desc, alarmDays) => {
      const endD = iso(addDays(parseD(end || start), 1));
      L.push("BEGIN:VEVENT", `UID:${uid}@perimetru`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsDate(start)}`, `DTEND;VALUE=DATE:${icsDate(endD)}`, `SUMMARY:${icsEscape(title)}`, `DESCRIPTION:${icsEscape(desc)}`);
      if (alarmDays) L.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEscape(title)}`, `TRIGGER:-P${alarmDays}D`, "END:VALARM");
      L.push("END:VEVENT");
    };
    let n = 0;
    S.events.filter(e => live(e) && (e.tier || 3) <= 2 && daysTo(e.start) <= 365).forEach(e => { ev(e.id, e.start, e.end, `${e.title} · ${e.city || ccName(e.cc)}`, `${e.angle || ""}\nScrieți din ${fmtD(iso(addDays(parseD(e.start), -(e.advanceDays || 21))))}.`, e.advanceDays || 21); n++; });
    seasonsNow().forEach(se => { const w = iso(addDays(se.start, -56)); ev(`season-${se.id}-${iso(se.start)}`, w, w, `Scrieți acum: ${se.name}`, `${se.places}\nPe cine contactăm: ${se.who}`, 0); n++; });
    S.opps.filter(o => o.deadline && daysTo(o.deadline) >= 0 && !["ignorat", "expirat"].includes(o.stage || "nou")).forEach(o => { ev(`opp-${o.id}`, o.deadline, o.deadline, `Termen: ${o.title}`, `${o.summary || ""}\n${o.url || ""}`, 3); n++; });
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Perimetru//RO", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Perimetru", ...L, "END:VCALENDAR"].join("\r\n");
    try { await downloads.save({ filename: `perimetru-calendar-${iso(today())}.ics`, data: ics }); toast(`${n} intrări în calendar. Deschideți fișierul pe telefon ca să le adăugați.`); } catch (e) { toast("Export anulat."); }
  }

  async function awardPressDraft(o) {

  const barRow = (label, frac, valueText, title) => `<div class="bar" title="${esc(title || `${label}: ${valueText}`)}"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span><span class="track"><span class="fill" style="width:${Math.max(0, Math.min(1, frac)) * 100}%"></span></span><span class="v">${esc(valueText)}</span></div>`;
  function viewStats() {
    const sent = S.drafts.filter(d => d.sentAt && d.step !== 2);
    const replied = sent.filter(d => d.repliedAt);
    const group = (keyFn, labelFn) => {
      const g = {}; sent.forEach(d => { const k = keyFn(d) || "—"; (g[k] ||= { n: 0, r: 0 }); g[k].n++; if (d.repliedAt) g[k].r++; });
      const rows = Object.entries(g).sort((a, b) => b[1].n - a[1].n);
      return rows.length ? `<div class="bars">${rows.map(([k, v]) => barRow(labelFn(k), v.r / v.n, `${v.r}/${v.n} · ${Math.round(v.r * 100 / v.n)}%`, `${labelFn(k)}: ${v.r} răspunsuri din ${v.n} e-mailuri`)).join("")}</div>` : `<p class="note">Apare după primele e-mailuri trimise.</p>`;
    };
    const funnel = STAGES.map(([k, v]) => [v, S.orgs.filter(o => (o.status || "nou") === k).length]);
    const fmax = Math.max(1, ...funnel.map(f => f[1]));
    const rate = sent.length ? Math.round(replied.length * 100 / sent.length) : 0;
    const meetings = S.orgs.filter(o => ["intalnire", "client"].includes(o.status)).length;
    const panel = (t, body) => `<div class="panel" style="margin:0;max-width:none"><h3>${t}</h3>${body}</div>`;
    return `
      <div class="view-head"><div class="grow"><div class="eyebrow">Statistici</div><h1>Ce funcționează</h1>

      <div class="kpis"><div class="kpi"><div class="n">${sent.length}</div><div class="l">e-mailuri trimise</div></div><div class="kpi gold"><div class="n">${rate}%</div><div class="l">rată de răspuns</div></div><div class="kpi"><div class="n">${meetings}</div><div class="l">întâlniri și clienți</div></div><div class="kpi"><div class="n">${S.orgs.filter(o => o.status === "client").length}</div><div class="l">clienți</div></div></div>
      <div class="statgrid">
        ${panel("Răspuns pe tip de companie", group(d => orgById(d.orgId)?.type, k => ORG_TYPES[k] || k))}
        ${panel("Răspuns pe țară", group(d => orgById(d.orgId)?.cc, k => ccName(k)))}
        ${panel("Răspuns pe limbă", group(d => d.lang, k => ({ en: "Engleză", ro: "Română", fr: "Franceză", it: "Italiană", de: "Germană", ar: "Arabă" }[k] || k)))}
        ${panel("Răspuns pe tipul ofertei", group(d => d.offer || "cp", k => ({ cp: "Doar protecție", bundle: "Protecție + lux", lux: "Concierge de lux" }[k] || k)))}
        ${panel("Pipeline", `<div class="bars">${funnel.map(([l, n]) => barRow(l, n / fmax, String(n))).join("")}</div>`)}
      </div>`;
  }

  function translateDom(root) {
    if (!root) return;
    const toEn = S.lang === "en";
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n; while ((n = w.nextNode())) {
      if (toEn) { const k = n.nodeValue.trim(); if (k && EN[k] && !n.__ro) { n.__ro = n.nodeValue; n.nodeValue = n.nodeValue.replace(k, EN[k]); } }
      else if (n.__ro) { n.nodeValue = n.__ro; delete n.__ro; }
    }
    root.querySelectorAll?.("[placeholder]").forEach(el => {
      if (toEn) { const k = el.getAttribute("placeholder"); if (EN[k]) { el.dataset.phRo = k; el.setAttribute("placeholder", EN[k]); } }
      else if (el.dataset.phRo) { el.setAttribute("placeholder", el.dataset.phRo); delete el.dataset.phRo; }
    });
  }

    $("#scrim").addEventListener("click", (ev) => { if (ev.target.id === "scrim") closeModal(); });

    $(".modal input, .modal select, .modal textarea", L)?.focus();
  }

  function template(o, e, lang, c, offer) {
    const evLine = e ? `${e.title} (${range(e.start, e.end)}${e.title.includes(e.city) ? "" : ", " + e.city})` : "";
    const greet = c?.name ? c.name.split(" ")[0] : null;
    const lux = offer === "lux";
    const introEn = lux
      ? "We look after private clients who expect everything to be arranged quietly and well: yachts for the season, supercars and luxury cars through our brand partners, rare watches, jewellery and luxury goods, and access to exclusive venues, private clubs and events, together with private jets, 5-star hotels and, when needed, discreet close protection."
      : `We are a UK-headquartered close protection company operating across Europe, the Middle East and worldwide; our teams have worked the Cannes and Venice film festivals and the amfAR, Better World Fund and Global Gift galas.${offer === "cp" ? "" : " Alongside protection we arrange yachts, luxury and armoured cars with elite drivers, cars through our brand partners, luxury goods, exclusive venues and private clubs, private jets and 5-star hotels."}`;
    const introRo = lux
      ? "Ne ocupăm de clienți privați care se așteaptă ca totul să fie organizat discret și impecabil: yachturi pentru sezon, mașini de lux și supercar-uri prin partenerii noștri, ceasuri rare, bijuterii și produse de lux, acces la locuri exclusiviste, cluburi private și evenimente, plus avion privat, hoteluri de 5 stele și, când e nevoie, protecție apropiată discretă."
      : `Suntem o companie de close protection cu sediul în Regatul Unit, activă în Europa, Orientul Mijlociu și în toată lumea; echipele noastre au lucrat la festivalurile de film de la Cannes și Veneția și la galele amfAR, Better World Fund și Global Gift.${offer === "cp" ? "" : " Pe lângă protecție, organizăm yachturi, mașini de lux și blindate cu șoferi, mașini prin partenerii noștri de brand, produse de lux, locuri exclusiviste și cluburi private, avion privat și hoteluri de 5 stele."}`;
    const evEn = e ? (lux ? `With ${evLine} coming up, we can take care of the whole stay for your clients: yacht, cars, villa or hotel, tables and access, with security only if wanted.\n\n` : `With ${evLine} coming up, if any of your clients or talent will attend, we can take on the advance work, secure transfers and protection for the full stay.\n\n`) : "";
    const evRo = e ? (lux ? `Pentru ${evLine} ne putem ocupa de întreaga ședere a clienților voștri: yacht, mașini, vilă sau hotel, mese și acces, cu securitate doar dacă se dorește.\n\n` : `${evLine} aduce în zonă oaspeți cu profil înalt. Dacă aveți clienți sau artiști care participă, putem prelua advance-ul, transferurile și protecția pe toată durata șederii.\n\n`) : "";
    const oneEn = offer !== "cp" ? "Everything is arranged through a single point of contact, 24/7, in full confidentiality.\n\n" : "";
    const oneRo = offer !== "cp" ? "Totul se organizează printr-un singur punct de contact, 24/7, cu discreție totală.\n\n" : "";
    if (lang === "ro") return {
      subject: lux ? (e ? `Yacht, mașini și acces privat pentru ${e.title}` : `Servicii private de lux pentru ${o.name}`) : e ? `Protecție discretă pentru ${e.title}` : `Protecție și servicii private pentru ${o.name}`,
      body: `Bună ziua${greet ? `, ${greet}` : ""},\n\nVă scriu din partea {{company}}. ${introRo}\n\n${evRo}${oneRo}Ați fi deschis la o discuție de 15 minute săptămâna viitoare?\n\nCu stimă,\n{{signature}}\n\nDacă nu doriți să mai primiți mesaje de la noi, răspundeți cu „stop”.`
    };
    return {
      subject: lux ? (e ? `Yachts, cars and private access for ${e.title}` : `Private luxury services for ${o.name}`) : e ? `Close protection for ${e.title}` : `Discreet protection and private services for ${o.name}`,
      body: `Dear ${greet || o.greeting || "team"},\n\nI'm writing from {{company}}. ${introEn}\n\n${evEn}${oneEn}Would you be open to a 15-minute call next week?\n\nKind regards,\n{{signature}}\n\nIf you'd rather not hear from us again, reply "stop" and we'll remove you.`
    };
  }

  async function createDraft({ orgId, contactId, eventId, lang, offer = "cp", note, useAI, subject, body, quiet }) {
    const o = orgById(orgId), e = evById(eventId), c = S.contacts.find(x => x.id === contactId);
    if (!o) return null;
    let out = subject && body ? { subject, body } : template(o, e, lang, c, offer);
    const rationale = e ? `Ancoră: ${e.title}, ${fmtD(e.start)} · ${e.city}, ${evCountry(e)}. Advance recomandat înainte de ${fmtD(iso(addDays(parseD(e.start), -(e.advanceDays || 21))))}.` : `Prezentare generală pentru ${ORG_TYPES[o.type] || o.type}.`;
    if (useAI && sample && !(subject && body)) {
      try {
        const cfg = S.config || {};
        const svc = services().map(s => `${s.name}${s.partners ? ` (parteneri: ${s.partners})` : ""}`).join("; ");
        const res = await sample.json(
`You write first-contact B2B emails for a close protection and private luxury services company. Write ONE email.
Rules: language = ${lang}. 110-170 words. Warm, discreet, senior tone; no hype, no fear-mongering, no invented facts or names. Mention the event only as public information. Offer a 15-minute call. Sign with the literal placeholder {{signature}} and refer to the company as {{company}} unless a name is given. End with a one-line opt-out ("reply stop") in the same language.
Offer focus: ${offer === "cp" ? "close protection only" : offer === "bundle" ? "close protection first, plus one or two sentences on the luxury side: yachts, luxury cars through brand partners, luxury goods (watches, jewellery, fashion), exclusive venues and private clubs, private jets, 5-star hotels" : "private luxury services first (yachts, luxury cars and supercars through brand partners, rare watches, jewellery and luxury goods, exclusive venues, private clubs and events, private jets, 5-star hotels), with close protection only as a quiet extra"}.
Return JSON: {"subject": string, "body": string}.

Sender: ${cfg.company || "{{company}}"}; base: ${cfg.base || "Bucharest"}; differentiators: ${cfg.pitch || "discreet multilingual teams; advance and recon; secure transfers; 24/7"}. Services: ${svc}.
Recipient organisation: ${o.name} (${ORG_TYPES[o.type] || o.type}, ${o.hq || ""}). Why relevant: ${o.why || ""}.
${c ? `Recipient person: ${c.name || "(no name)"}, ${c.role || ""}. Greet them by first name if a name is given.` : "No named person: greet the team."}
${e ? `Anchor event: ${e.title}, ${range(e.start, e.end)} ${parseD(e.start).getFullYear()}, ${e.venue || ""} ${e.city}, ${evCountry(e)}. Context: ${e.angle}` : "No anchor event: general introduction."}
${note ? "Extra instruction from the owner: " + note : ""}`, { modelTier: "default" });
        if (res?.subject && res?.body) out = res;
      } catch (err) { toast(err?.code === "rate_limited" ? "AI-ul e ocupat; am folosit șablonul." : err?.code === "not_granted" ? "AI-ul nu are acordul tău; am folosit șablonul." : "AI indisponibil; am folosit șablonul."); }
    }
    const id = newId("dr");
    const ok = await put("drafts", id, { orgId, contactId: contactId || "", eventId: eventId || "", lang, offer, subject: out.subject, body: out.body, to: c?.email || "", status: "de_aprobat", step: 1, rationale, createdAt: new Date().toISOString(), by: useAI ? "ai" : "sablon" });
    if (ok && !quiet) { closeModal(); S.f.sub = "de_aprobat"; location.hash = "#approvals"; toast("Draft pregătit pentru aprobare"); }
    return ok ? id : null;
  }

  // ---------- web research on demand ----------
  async function launchResearch(question, kind = "intrebare") {
    const id = newId("rq");
    const sweep = kind === "scanare";
    if (!await put("requests", id, { question, kind, status: sweep ? "în lucru" : "nou", createdAt: new Date().toISOString() })) return null;
    let fired = false;
    if (mcp) {
      try { await mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: RESEARCH_TRIGGER, text: sweep ? question : `Request ${id}: ${question}` }); fired = true; }
      catch (e) { fired = false; }
    }
    await patch("requests", id, { fired, firedAt: fired ? new Date().toISOString() : "" , status: sweep && !fired ? "nou" : (sweep ? "în lucru" : "nou") });
    return { id, fired };
  }
  // Scans go into a queue that a single background session works through one at a time
  // (running many at once exhausts the account's usage window).
  async function enqueueScan(items) {
    const base = Date.now();
    let n = 0;
    for (const it of items) { if (await put("scanqueue", newId("sq"), { ...it, status: "nou", priority: it.priority ?? 5, createdAt: new Date(base + n).toISOString() })) n++; }
    if (!n) return;
    let fired = false;
    const running = S.scanqueue.some(q => q.status === "în lucru" && daysTo((q.startedAt || "").slice(0, 10)) >= 0);
    if (mcp && !running) { try { await mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: SCANNER_TRIGGER, text: "QUEUE" }); fired = true; } catch (e) {} }
    toast(`${n} ${n === 1 ? "scanare adăugată" : "scanări adăugate"} în coadă${fired ? "; prima pornește acum" : "; rulează automat, pe rând"}.`);
  }
  async function scanCountries(ccs, label, kinds = ["sweep", "directory"]) {
    const items = [];
    if (kinds.includes("sweep")) for (let k = 0; k < ccs.length; k += 10) items.push({ kind: "sweep", ccs: ccs.slice(k, k + 10), label: `Evenimente: ${label}`, priority: 3 });
    if (kinds.includes("directory")) ccs.forEach(cc => items.push({ kind: "directory", ccs: [cc], label: `Director lux: ${ccName(cc)}`, priority: 4 }));
    await enqueueScan(items);
  }

    y = 230; doc.setTextColor(40, 40, 40); doc.setFontSize(11); const intro = doc.splitTextToSize(tr(g.intro), W - 2 * M); doc.text(intro, M, y); y += intro.length * 15 + 16;
    for (const [head, items] of g.sections) {
      if (y > 700) { footer(); doc.addPage(); y = 70; }
      doc.setDrawColor(...acc); doc.setLineWidth(1); doc.line(M, y, M + 40, y); y += 18;
      doc.setFont("helvetica", "bold"); doc.setFontSize(12.5); doc.setTextColor(20, 20, 20); doc.text(tr(head), M, y); y += 18;
      doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.setTextColor(55, 55, 55);
      for (const it of items) {
        const lines = doc.splitTextToSize(tr(it), W - 2 * M - 16);
        if (y + lines.length * 14 > 780) { footer(); doc.addPage(); y = 70; doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.setTextColor(55, 55, 55); }
        doc.setFillColor(...acc); doc.circle(M + 3, y - 3.5, 2, "F"); doc.text(lines, M + 16, y); y += lines.length * 14 + 6;
      }
      y += 10;
    }
    if (y > 690) { footer(); doc.addPage(); y = 70; }
    doc.setFillColor(246, 243, 236); doc.rect(M - 14, y, W - 2 * M + 28, 84, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(20, 20, 20); doc.text(tr("Need a second pair of eyes?"), M, y + 24);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(60, 60, 60);
    doc.text(doc.splitTextToSize(tr(`${c.company || "Platinum Close Protection"} provides discreet close protection, secure transfers and private logistics across the UK, Europe, the Middle East and worldwide. ${[c.phone, (c.signature || "").match(/[\w.+-]+@[\w.-]+/)?.[0], c.website].filter(Boolean).join("  -  ")}`), W - 2 * M), M, y + 42);
    footer();
    try { await downloads.save({ filename: `${g.file}.pdf`, data: doc.output("arraybuffer") }); toast("Ghid descărcat"); return true; }
    catch (err) { toast(err?.code === "declined" ? "Descărcare anulată." : "Nu am putut salva PDF-ul."); return false; }
  }

  const SEO_TASKS = [
    ["gbp-london", "Profil Google Business pentru Londra (adresa biroului, categoria „Security service”, program, fotografii fără clienți)"],
    ["gbp-dubai", "Profil Google Business pentru Dubai, dacă aveți adresă acolo"],
    ["gbp-other", "Profil Google Business pentru fiecare alt oraș unde aveți adresă reală (Monaco, București)"],
    ["pages-city", "Pe site: o pagină pentru fiecare oraș (Londra, Dubai, Monaco, Cannes, Paris, Geneva, St. Moritz, București), cu serviciile de acolo"],
    ["pages-event", "Pe site: o pagină pentru fiecare eveniment mare (Cannes, Monaco GP, Davos, Art Basel, Royal Ascot), publicată cu 2–3 luni înainte"],
    ["pages-lang", "Paginile principale și în arabă, franceză și română"],
    ["reviews", "Cereți recenzii pe Google clienților mulțumiți (fără nume dacă nu vor) după fiecare misiune"],
    ["directories", "Listări în directoarele profesionale unde sunteți eligibili (asociații de profil, camere de comerț, directoare de furnizori pentru family offices)"],
    ["guides-site", "Puneți ghidurile gratuite pe site, cu formular de descărcare: aduc contacte care vă caută ei"],
    ["linkedin-company", "Pagina de companie LinkedIn completă, cu link spre site și spre ghiduri"]
  ];
  function viewMarketing() {
    const done = S.seo.find(x => x.id === "checklist")?.done || {};
    const weeks = S.seo.filter(x => x.id.startsWith("wk-")).sort((a, b) => b.id.localeCompare(a.id));
    const last = weeks[0];
    const pct = Math.round(100 * SEO_TASKS.filter(([k]) => done[k]).length / SEO_TASKS.length);
    return `
      <div class="view-head"><div class="grow">
        <div class="eyebrow">Marketing</div>
        <h1>Ghiduri gratuite și vizibilitate pe Google</h1>
        <p>Ghidurile se oferă în primul e-mail în locul unei oferte: sunt mai ușor de acceptat și vă poziționează ca experți. Vizibilitatea aduce clienții care vă caută ei pe voi.</p>
      </div></div>
      <div class="eyebrow" style="margin-bottom:10px">Ghiduri PDF (în engleză, în stilul Platinum)</div>
      <div class="services">${GUIDES.map(g => `<div class="panel"><h3>${esc(g.title)}</h3><p class="note" style="margin:0 0 6px">${esc(g.sub)}</p><p class="note" style="margin:0 0 10px">Pentru: ${esc(g.for)} · ${g.sections.length} capitole</p><button class="btn primary sm" data-act="guide-pdf" data-id="${g.id}">Descarcă PDF</button></div>`).join("")}</div>
      <p class="note">La „De aprobat”, butonul „Oferă ghidul” rescrie e-mailul ca să ofere ghidul potrivit în loc de o întâlnire. Atașați PDF-ul când trimiteți sau trimiteți-l celor care răspund „da”.</p>
      <div class="eyebrow" style="margin:22px 0 10px">Vizibilitate pe Google · ${pct}% din pași făcuți</div>
      <div class="panel">${SEO_TASKS.map(([k, t]) => `<label class="check" style="align-items:flex-start"><input type="checkbox" data-act="seo-task" data-id="${k}" ${done[k] ? "checked" : ""}><span>${esc(t)}</span></label>`).join("")}</div>
      <div class="eyebrow" style="margin:22px 0 10px">Verificarea săptămânală (luni dimineața)</div>
      ${!last ? `<div class="empty"><h3>Prima verificare vine luni</h3><p>În fiecare săptămână căutăm „close protection” și „bodyguard” în orașele voastre și notăm dacă apare ${esc((S.config || {}).website || "site-ul vostru")} și cine apare în locul vostru.</p></div>` :
      `<div class="panel"><p class="note" style="margin:0 0 10px">${esc(fmtD(last.date))} · apăreți la ${(last.results || []).filter(r => r.found).length} din ${(last.results || []).length} căutări${weeks[1] ? ` (săptămâna trecută: ${(weeks[1].results || []).filter(r => r.found).length})` : ""}</p>
        <div class="contacts">${(last.results || []).map(r => `<div class="ct" style="grid-template-columns:minmax(0,1.2fr) auto minmax(0,1.5fr)"><div class="nm">${esc(r.q)}</div><div>${r.found ? `<span class="pill ok">apare${r.rank ? " #" + esc(r.rank) : ""}</span>` : `<span class="pill warn">nu apare</span>`}</div><div class="note">${esc((r.top || []).slice(0, 3).join(" · "))}</div></div>`).join("")}</div>
        ${last.advice ? `<p class="note" style="margin:10px 0 0">${esc(last.advice)}</p>` : ""}</div>`}`;
  }

  const groupOf = (v) => NAV.find(([, , views]) => views.some(([vk]) => vk === v)) || NAV[0];
  const VIEWS = { marketing: viewMarketing, celebs: viewCelebs, map: viewMap, seasons: viewSeasons, referrals: viewReferrals, opps: viewOpps, content: viewContent, uhnwi: viewUhnwi, luxury: viewLuxury, today: viewToday, stats: viewStats, radar: viewRadar, countries: viewCountries, contacts: viewContacts, targets: viewTargets, signals: viewSignals, approvals: viewApprovals, pipeline: viewPipeline, services: viewServices, alerts: viewAlerts, setup: viewSetup };
  const current = () => { const h = location.hash.slice(1); return VIEWS[h] ? h : "today"; };
  function render() {
    const v = current();
    const active = document.activeElement;
    if (active && active.closest?.(".draft-body, #cfgForm, .modal") && render.lastView === v) { render.pending = true; return; }
    render.lastView = v;
    $("#main").innerHTML = VIEWS[v]();
    const unread = S.alerts.filter(a => !a.read).length;
    $("#bellBadge").hidden = !unread; $("#bellBadge").textContent = unread;
    const n = {
      today: S.ready ? todayActions().length : 0, alerts: unread, radar: S.events.filter(live).length, seasons: seasonsNow().filter(x => x.phase === "outreach").length,
      countries: Object.keys(usedCountries()).length, contacts: S.contacts.length, uhnwi: S.uhnwi.length, referrals: refsDue().length, targets: S.orgs.length,
      celebs: S.celebs.length, luxury: S.orgs.filter(o => LUX_TYPES.has(o.type)).length, signals: S.signals.length, opps: S.opps.filter(o => (o.stage || "nou") === "nou").length,
      approvals: S.drafts.filter(d => d.status === "de_aprobat").length, pipeline: dueFollowUps().length, content: postsDue().length
    };
    const cnt = (x) => x ? `<span class="count">${x}</span>` : "";
    // the group badge shows only what needs action, not totals
    const groupBadge = { today: n.today, radar: n.seasons, people: n.referrals, opps: n.opps, outreach: n.approvals + n.pipeline + n.content };
    const g = groupOf(v);
    $("#tabs").innerHTML = NAV.map(([k, label, views]) => `<a href="#${views[0][0]}" ${k === g[0] ? 'aria-current="page"' : ""}>${label} ${cnt(groupBadge[k])}</a>`).join("");
    const sub = $("#subnav"); sub.hidden = g[2].length < 2;
    sub.innerHTML = g[2].length < 2 ? "" : g[2].map(([vk, label, showCount]) => `<a href="#${vk}" ${vk === v ? 'aria-current="page"' : ""}>${label} ${showCount ? cnt(n[vk]) : ""}</a>`).join("");
    if (S.lang === "en") { translateDom($("#tabs")); translateDom(sub); }
    { const nav = $("#tabs"), act = nav.querySelector("[aria-current=page]"); if (act && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = act.offsetLeft - (nav.clientWidth - act.offsetWidth) / 2; }
    $("#langBtn").textContent = S.lang === "en" ? "RO" : "EN";
    applyBrand();
    translateDom($("#main"));
    if (S.config?.company) $("#brandSub").textContent = `${S.config.company} · There… Always`;
    if (AI.pending.length) {
      const done = AI.pending.map(id => S.requests.find(r => r.id === id)).filter(r => r && r.status === "rezolvat" && r.answer);
      if (done.length) { done.forEach(r => AI.turns.push({ role: "assistant", content: `**Rezultat cercetare:** ${r.question}\n\n${r.answer}` })); AI.pending = AI.pending.filter(id => !done.some(r => r.id === id)); saveAI(); if (!AI.busy) renderAI(); toast("Concierge AI: a sosit rezultatul cercetării"); }
    }
    if (!AI.busy && $("#aiLog") && !AI.turns.length) renderAI();
  }
  function applyBrand() {
    const b = S.brand || {};
    const root = document.documentElement.style;
    if (b.accent) { root.setProperty("--gold", b.accent); root.setProperty("--gold-soft", b.accent + "22"); } else { root.removeProperty("--gold"); root.removeProperty("--gold-soft"); }
    for (const id of ["brandLogo", "arrLogo"]) { const im = document.getElementById(id); if (!im) continue; if (b.logoUrl) { if (im.getAttribute("src") !== b.logoUrl) im.src = b.logoUrl; im.hidden = false; } else im.hidden = true; }
    const mark = document.getElementById("brandMark"); if (mark) mark.style.display = b.logoUrl ? "none" : "";
  }
  document.addEventListener("focusout", () => { if (render.pending) { render.pending = false; setTimeout(render, 0); } });
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  // ---------- arrival ----------
  function setupArrival() {
    const arr = $("#arrival");
    let seen = false; try { seen = sessionStorage.getItem("perimetru.entered") === "1"; } catch (e) {}
    if (seen) { arr.remove(); $("#aiFab").hidden = false; return; }
    const tick = () => { try { const t = new Intl.DateTimeFormat("ro-RO", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Monaco" }).format(new Date()); $("#arrCoords").textContent = `Monaco · 43.7384° N · 7.4246° E · ${t} ora locală`; } catch (e) {} };
    tick(); const iv = setInterval(tick, 30000);
    const h = new Date().getHours(); const salut = h < 11 ? "Bună dimineața" : h < 18 ? "Bună ziua" : "Bună seara";
    $("#arrGreet").textContent = `${salut}.`;
    const enter = () => { try { sessionStorage.setItem("perimetru.entered", "1"); } catch (e) {} arr.classList.add("leaving"); $("#aiFab").hidden = false; clearInterval(iv); setTimeout(() => arr.remove(), 750); };
    $("#enterBtn").onclick = enter;
    arr.addEventListener("keydown", (e) => { if (e.key === "Enter") enter(); });
    $("#enterBtn").focus();
    setupArrival.greet = (name) => { if (name && document.contains(arr)) $("#arrGreet").textContent = `${salut}, ${name.split(" ")[0]}.`; };
  }

  // ---------- boot ----------
  setupArrival();
  document.documentElement.lang = S.lang;
  render();
  translateDom(document.querySelector("header.top")); translateDom($("#arrival"));
  (async () => {
    const use = async (n) => { try { return await window.claude?.use?.(n); } catch (e) { return null; } };
    [db, sample, userCap, assets, downloads, mcp] = await Promise.all([use("db"), use("sample"), use("user"), use("assets"), use("downloads"), use("mcp")]);
    if (userCap?.me) { try { S.me = await userCap.me(); setupArrival.greet?.(S.me?.name); } catch (e) {} }
    S.dbOk = !!db;
    if (!db) { render(); return; }
    const cols = ["opps", "referrals", "photos", "celebs", "events", "orgs", "drafts", "alerts", "contacts", "signals", "requests", "scanqueue", "uhnwi", "missions", "partners", "deals", "team", "posts", "inbound", "optouts", "proposals", "countryintel", "seo"];
    const pending = new Set(cols);
    cols.forEach(name => db.collection(name).limit(1000).onSnapshot((snap) => {
      S[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      pending.delete(name); if (!pending.size) S.ready = true; render();
    }, () => { pending.delete(name); if (!pending.size) S.ready = true; render(); }));
    db.doc("config/main").onSnapshot((s) => { S.config = s.exists ? s.data() : {}; render(); }, () => {});
    db.doc("config/pricing").onSnapshot((s) => { S.pricing = s.exists ? s.data() : {}; render(); }, () => {});
    db.doc("config/brand").onSnapshot((s) => { S.brand = s.exists ? s.data() : {}; render(); }, () => {});
    db.doc("config/services").onSnapshot((s) => { S.services = s.exists ? (s.data().items || null) : null; render(); }, () => {});
  })();
})();
</script>

<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard vânzări din CSV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <header class="page-header">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M4 19V10M12 19V5M20 19V13" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Dashboard vânzări din CSV</h1>
      <p class="subtitle">Urcă orice CSV de vânzări — curat sau murdar — și primești tabel curățat, cifre-cheie, grafice și răspunsuri în română.</p>
    </header>
  </div>

  <main>
    <section class="panel upload-panel" aria-label="Încărcare CSV">
      <label class="dropzone" id="dropzone" for="file-input" tabindex="0">
        <span class="dropzone-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M12 16V4M12 4L7 9M12 4l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="dropzone-title" id="dropzone-title">Trage un fișier CSV aici sau apasă ca să alegi</span>
        <span class="dropzone-hint">Funcționează cu orice CSV de vânzări, inclusiv date murdare.</span>
        <input type="file" id="file-input" accept=".csv,text/csv" hidden />
      </label>
      <div id="upload-status" class="upload-status" role="status" aria-live="polite"></div>
    </section>

    <section id="results" class="results hidden">
      <section class="panel" id="report-panel" aria-label="Raport curățare">
        <h2><span class="section-icon icon-clean" aria-hidden="true"></span>Ce am curățat</h2>
        <p id="report-text" class="report-text"></p>
      </section>

      <section class="panel" id="stats-panel" aria-label="Cifre cheie">
        <h2><span class="section-icon icon-stats" aria-hidden="true"></span>Cifre cheie</h2>
        <div id="stat-tiles" class="stat-tiles"></div>
      </section>

      <section class="panel" id="anomalies-panel" aria-label="Anomalii">
        <h2><span class="section-icon icon-warn" aria-hidden="true"></span>Valori neobișnuite</h2>
        <div id="anomalies-list" class="anomalies-list"></div>
      </section>

      <section class="panel" id="charts-panel" aria-label="Grafice">
        <h2><span class="section-icon icon-chart" aria-hidden="true"></span>Grafice</h2>
        <div id="charts" class="charts-grid"></div>
      </section>

      <section class="panel" id="recommendations-panel" aria-label="Recomandări">
        <h2><span class="section-icon icon-idea" aria-hidden="true"></span>Recomandări</h2>
        <div id="recommendations-data" class="recommendation-list"></div>
        <h3 class="recommendations-subhead">Context de piață (România, sept. 2026)</h3>
        <div id="recommendations-market" class="recommendation-list"></div>
      </section>

      <section class="panel" id="ask-panel" aria-label="Întreabă despre date">
        <h2><span class="section-icon icon-ask" aria-hidden="true"></span>Întreabă despre date</h2>
        <form id="ask-form" class="ask-form">
          <input type="text" id="ask-input" placeholder="Ex: Cine e cel mai bun client?" autocomplete="off" />
          <button type="submit">Întreabă</button>
        </form>
        <p id="ask-answer" class="ask-answer" aria-live="polite"></p>
      </section>

      <section class="panel" id="table-panel" aria-label="Tabel date curățate">
        <h2><span class="section-icon icon-table" aria-hidden="true"></span>Tabel</h2>
        <div class="table-scroll">
          <table id="data-table"></table>
        </div>
        <p id="table-note" class="table-note"></p>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

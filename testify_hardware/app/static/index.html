<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>Testify Hardware — Calcul lunar</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Testify">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Ecran de autentificare / prima configurare -->
  <section id="auth-screen" class="auth hidden">
    <div class="auth-card glass">
      <img src="/static/logo.svg" alt="" class="auth-logo">
      <h1 id="auth-title">Bun venit înapoi</h1>
      <p id="auth-subtitle" class="muted">Introduceți parola ca să vedeți cifrele firmei.</p>
      <form id="auth-form" autocomplete="on">
        <label class="field">
          <span>Parolă</span>
          <input type="password" id="auth-password" required minlength="4" autocomplete="current-password" placeholder="••••••••">
        </label>
        <label class="field hidden" id="auth-confirm-wrap">
          <span>Confirmați parola</span>
          <input type="password" id="auth-confirm" minlength="4" autocomplete="new-password" placeholder="••••••••">
        </label>
        <label class="check hidden" id="auth-demo-wrap">
          <input type="checkbox" id="auth-demo" checked>
          <span>Încarcă datele firmei (T3 2026, din fișierele primite)</span>
        </label>
        <p id="auth-error" class="error" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit" id="auth-submit">Intră în aplicație</button>
      </form>
    </div>
  </section>

  <!-- Aplicația -->
  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div class="brand">
        <img src="/static/logo.svg" alt="">
        <div>
          <strong id="brand-name">Testify Hardware</strong>
          <small>Calcul lunar</small>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <button class="nav-item logout" id="logout-btn" type="button">
        <svg viewBox="0 0 24 24"><path d="M15 17l5-5-5-5M20 12H9M12 21H6a2 2 0 01-2-2V5a2 2 0 012-2h6"/></svg>
        <span>Ieșire</span>
      </button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="page-eyebrow"></p>
          <h1 id="page-title"></h1>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary quick-add" id="quick-add" type="button" aria-label="Adăugare rapidă">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Adaugă</span>
          </button>
          <div class="month-picker glass" id="month-picker">
            <button type="button" class="icon-btn" id="month-prev" aria-label="Luna anterioară">
              <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span id="month-label"></span>
            <button type="button" class="icon-btn" id="month-next" aria-label="Luna următoare">
              <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- Fereastră modală -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card glass">
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" type="button" id="modal-close" aria-label="Închide">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Asistentul Testi -->
  <div id="assistant" class="assistant hidden">
    <section id="assistant-panel" class="assistant-panel hidden" aria-label="Asistentul Testi">
      <header class="assistant-head">
        <div id="assistant-avatar" class="assistant-avatar"></div>
        <div style="flex:1">
          <strong>Testi</strong>
          <small><span class="live-dot"></span>Asistentul tău financiar</small>
        </div>
        <button class="icon-btn" type="button" id="assistant-close" aria-label="Închide asistentul">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div id="assistant-messages" class="assistant-messages" aria-live="polite"></div>
      <footer id="assistant-actions" class="assistant-actions"></footer>
    </section>
    <button id="assistant-fab" class="assistant-fab" type="button" aria-label="Deschide asistentul Testi"></button>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

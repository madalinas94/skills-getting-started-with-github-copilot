<!DOCTYPE html>
<html lang="ro" data-theme="ivory">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Desktop Buddy</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="buddy.css">
</head>
<body>
  <div id="toast"></div>
  <div id="buddy">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#D5DEE9"/>
        </linearGradient>
        <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8A5530"/>
          <stop offset="1" stop-color="#5E3519"/>
        </linearGradient>
        <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
          <stop class="dress-top" offset="0" stop-color="#FF9CC2"/>
          <stop class="dress-bot" offset="1" stop-color="#F56FA1"/>
        </linearGradient>
        <radialGradient id="glow">
          <stop class="glow-in" offset="0" stop-color="#FFE3F0"/>
          <stop class="glow-out" offset="1" stop-color="#FF6FA5"/>
        </radialGradient>
      </defs>
    
      <!-- codițe (pigtails) -->
      <g class="pigtail pigtail-left">
        <path d="M46 72 C14 82 8 132 26 168 C32 158 36 150 34 140 C44 150 46 130 44 118 C52 108 54 92 56 82 Z" fill="url(#hair)"/>
        <path d="M30 110 C26 126 28 146 30 156" stroke="#4A2812" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/>
      </g>
      <g class="pigtail pigtail-right">
        <path d="M154 72 C186 82 192 132 174 168 C168 158 164 150 166 140 C156 150 154 130 156 118 C148 108 146 92 144 82 Z" fill="url(#hair)"/>
        <path d="M170 110 C174 126 172 146 170 156" stroke="#4A2812" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/>
      </g>
    
      <!-- antenă -->
      <line class="antenna-stick" x1="100" y1="34" x2="100" y2="14" stroke="#9AA8B8" stroke-width="4" stroke-linecap="round"/>
      <circle class="antenna-light" cx="100" cy="11" r="7" fill="url(#glow)"/>
    
      <!-- urechi robot -->
      <circle cx="45" cy="92" r="10" fill="#B8C4D2" stroke="#8E9BAC" stroke-width="2"/>
      <circle cx="155" cy="92" r="10" fill="#B8C4D2" stroke="#8E9BAC" stroke-width="2"/>
      <g class="earrings" display="none" fill="#FBF6EA" stroke="#CDBB97" stroke-width=".8">
        <circle cx="45" cy="106" r="3.6"/><circle cx="155" cy="106" r="3.6"/>
      </g>
    
      <!-- coc elegant (varianta matură) -->
      <g class="hair-bun" display="none">
        <ellipse cx="100" cy="24" rx="18" ry="14" fill="url(#hair)"/>
        <path d="M85 22 Q100 11 115 22" stroke="#4A2812" stroke-width="1.6" fill="none" opacity=".45"/>
        <path d="M88 29 Q100 22 112 29" stroke="#A76B40" stroke-width="1.4" fill="none" opacity=".6"/>
      </g>
    
      <!-- cap -->
      <rect x="46" y="32" width="108" height="96" rx="40" fill="url(#metal)" stroke="#9AA8B8" stroke-width="3"/>
    
      <!-- păr + breton -->
      <path d="M42 86 C32 12 168 12 158 86 C150 66 138 56 124 58 C120 48 108 44 100 50 C92 44 80 48 76 58 C62 56 50 66 44 84 Z" fill="url(#hair)"/>
      <path d="M68 42 C80 34 92 32 104 34" stroke="#A76B40" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
    
      <!-- fundițe -->
      <g transform="translate(48 74)">
        <path class="bow" d="M0 0 L-12 -9 L-12 9 Z M0 0 L12 -9 L12 9 Z" fill="#FF6FA5" stroke="#E0467F" stroke-width="1.5" stroke-linejoin="round"/>
        <circle class="bow-knot" r="4" fill="#E0467F"/>
      </g>
      <g transform="translate(152 74)">
        <path class="bow" d="M0 0 L-12 -9 L-12 9 Z M0 0 L12 -9 L12 9 Z" fill="#FF6FA5" stroke="#E0467F" stroke-width="1.5" stroke-linejoin="round"/>
        <circle class="bow-knot" r="4" fill="#E0467F"/>
      </g>
    
      <!-- accesorii sezoniere (afișate prin CSS) -->
      <g class="acc-beret" display="none">
        <ellipse cx="84" cy="31" rx="42" ry="13" fill="#5c1a2b" transform="rotate(-9 84 31)"/>
        <ellipse cx="84" cy="36" rx="36" ry="5" fill="#46121f" transform="rotate(-9 84 36)" opacity=".6"/>
        <circle cx="80" cy="17" r="3.5" fill="#5c1a2b"/>
      </g>
      <g class="acc-sun" display="none">
        <rect x="71" y="34" width="24" height="13" rx="6" fill="#1b2a3a" stroke="#d0a93a" stroke-width="1.5"/>
        <rect x="105" y="34" width="24" height="13" rx="6" fill="#1b2a3a" stroke="#d0a93a" stroke-width="1.5"/>
        <path d="M95 39 Q100 35 105 39" stroke="#d0a93a" stroke-width="2" fill="none"/>
        <path d="M75 37 l6 -1" stroke="#ffffff" stroke-width="1.5" opacity=".5" stroke-linecap="round"/>
      </g>
      <g class="acc-flowers" display="none">
        <path d="M58 58 Q100 18 142 58" stroke="#7d9470" stroke-width="2.5" fill="none"/>
        <g transform="translate(64 50)"><circle r="5.5" fill="#f4c7cf"/><circle r="2.2" fill="#e7b75f"/></g>
        <g transform="translate(80 37)"><circle r="6" fill="#fbe4e8"/><circle r="2.2" fill="#e7b75f"/></g>
        <g transform="translate(100 32)"><circle r="6.5" fill="#f4c7cf"/><circle r="2.4" fill="#e7b75f"/></g>
        <g transform="translate(120 37)"><circle r="6" fill="#fbe4e8"/><circle r="2.2" fill="#e7b75f"/></g>
        <g transform="translate(136 50)"><circle r="5.5" fill="#f4c7cf"/><circle r="2.2" fill="#e7b75f"/></g>
        <ellipse cx="90" cy="33" rx="4" ry="2" fill="#8fa382" transform="rotate(-20 90 33)"/>
        <ellipse cx="110" cy="33" rx="4" ry="2" fill="#8fa382" transform="rotate(20 110 33)"/>
      </g>
    
      <!-- ecran față -->
      <rect x="62" y="70" width="76" height="48" rx="18" fill="#1E2A3A"/>
      <g class="eyes">
        <ellipse class="eye" cx="84" cy="92" rx="7" ry="9" fill="#6FF3FF"/>
        <ellipse class="eye" cx="116" cy="92" rx="7" ry="9" fill="#6FF3FF"/>
        <circle cx="86" cy="88" r="2.2" fill="#FFFFFF"/>
        <circle cx="118" cy="88" r="2.2" fill="#FFFFFF"/>
      </g>
      <circle class="blush" cx="72" cy="106" r="5" fill="#FF8FB8" opacity=".7"/>
      <circle class="blush" cx="128" cy="106" r="5" fill="#FF8FB8" opacity=".7"/>
      <path class="mouth" d="M93 106 Q100 112 107 106" stroke="#6FF3FF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- expresii alternative (afișate prin CSS, după stare) -->
      <g class="eyes-happy" display="none">
        <path class="eye-line" d="M77 95 Q84 84 91 95" stroke="#6FF3FF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path class="eye-line" d="M109 95 Q116 84 123 95" stroke="#6FF3FF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </g>
      <g class="eyes-closed" display="none">
        <path class="eye-line" d="M77 91 Q84 97 91 91" stroke="#6FF3FF" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="eye-line" d="M109 91 Q116 97 123 91" stroke="#6FF3FF" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <circle class="mouth-o eye-line" cx="100" cy="107.5" r="3.6" stroke="#6FF3FF" stroke-width="2.6" fill="none" display="none"/>
      <path class="mouth-flat eye-line" d="M94 107 L106 107" stroke="#6FF3FF" stroke-width="3" fill="none" stroke-linecap="round" display="none"/>
    
      <!-- gât -->
      <rect x="90" y="126" width="20" height="10" rx="3" fill="#B8C4D2"/>
    
      <!-- brațe -->
      <g class="arm arm-left">
        <rect x="46" y="140" width="14" height="40" rx="7" fill="url(#metal)" stroke="#9AA8B8" stroke-width="2"/>
        <circle cx="53" cy="184" r="7" fill="#B8C4D2"/>
      </g>
      <g class="arm arm-right">
        <rect x="140" y="140" width="14" height="40" rx="7" fill="url(#metal)" stroke="#9AA8B8" stroke-width="2"/>
        <circle cx="147" cy="184" r="7" fill="#B8C4D2"/>
      </g>
    
      <!-- rochiță -->
      <path class="dress" d="M68 134 L132 134 L150 204 Q100 214 50 204 Z" fill="url(#dress)" stroke="#E0467F" stroke-width="2" stroke-linejoin="round"/>
      <path class="emblem" d="M100 150 C95 143 86 147 90 154 L100 163 L110 154 C114 147 105 143 100 150 Z" fill="#FFFFFF"/>
      <g class="dots">
        <circle cx="80" cy="186" r="3" fill="#FFFFFF" opacity=".6"/>
      <circle cx="100" cy="192" r="3" fill="#FFFFFF" opacity=".6"/>
      <circle cx="120" cy="186" r="3" fill="#FFFFFF" opacity=".6"/>
      </g>
     <g class="acc-blazer" display="none">
        <path d="M86 135 L100 158 L114 135 Z" fill="#F4EFE6"/>
        <path d="M70 135 L97 176 L86 135 Z" fill="#26304a" stroke="#A88A5C" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M130 135 L103 176 L114 135 Z" fill="#26304a" stroke="#A88A5C" stroke-width="1.2" stroke-linejoin="round"/>
        <circle cx="100" cy="182" r="2.8" fill="#C9A96E"/><circle cx="100" cy="194" r="2.8" fill="#C9A96E"/>
        <path d="M118 150 l8 -3 l1 5 z" fill="#F4EFE6"/>
      </g>
      <path class="hem" d="M55 196 Q100 206 145 196" stroke="#C9A96E" stroke-width="2" fill="none" display="none"/>
      <g class="pearls" fill="#FBF6EA" stroke="#D2C2A2" stroke-width=".8" display="none">
        <circle cx="80" cy="137" r="2.8"/><circle cx="85.5" cy="140.5" r="2.8"/><circle cx="91.5" cy="142.8" r="2.8"/><circle cx="97.5" cy="143.8" r="2.8"/>
        <circle cx="103.5" cy="143.8" r="2.8"/><circle cx="109.5" cy="142.8" r="2.8"/><circle cx="115" cy="140.5" r="2.8"/><circle cx="120" cy="137" r="2.8"/>
      </g>
    
      <g class="acc-scarf" display="none">
        <path d="M66 127 Q100 147 134 127 L134 138 Q100 158 66 138 Z" fill="#eef1f7" stroke="#b9a57a" stroke-width="1.5"/>
        <path d="M114 138 L124 176 L110 174 L106 142 Z" fill="#eef1f7" stroke="#b9a57a" stroke-width="1.5"/>
        <path d="M112 166 L124 166 M111 170 L124 171" stroke="#b9a57a" stroke-width="1"/>
      </g>
    
      <!-- efecte de stare -->
      <g class="zzz" display="none" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-weight="700" fill="#A8864F">
        <text class="z1" x="146" y="44" font-size="16">z</text>
        <text class="z2" x="158" y="30" font-size="13">z</text>
        <text class="z3" x="168" y="18" font-size="10">z</text>
      </g>
      <g class="sparkles" display="none" fill="#D4B676">
        <path class="sp1" d="M28 40 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
        <path class="sp2" d="M170 58 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4z"/>
        <path class="sp3" d="M160 150 l2 4.5 4.5 2 -4.5 2 -2 4.5 -2 -4.5 -4.5 -2 4.5 -2z"/>
        <path class="sp4" d="M36 150 l2 4.5 4.5 2 -4.5 2 -2 4.5 -2 -4.5 -4.5 -2 4.5 -2z"/>
        <path class="sp5" d="M128 6 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8z"/>
      </g>
      <g class="alert" display="none">
        <circle cx="164" cy="30" r="11" fill="#8B2635" stroke="#F4ECDB" stroke-width="2"/>
        <path d="M164 23 v9" stroke="#F4ECDB" stroke-width="3" stroke-linecap="round"/>
        <circle cx="164" cy="36.5" r="1.8" fill="#F4ECDB"/>
      </g>
    
      <!-- picioare -->
      <rect x="80" y="206" width="13" height="18" rx="5" fill="#B8C4D2"/>
      <rect x="107" y="206" width="13" height="18" rx="5" fill="#B8C4D2"/>
      <ellipse class="shoe" cx="85" cy="226" rx="11" ry="6" fill="#6B3E5E"/>
      <ellipse class="shoe" cx="115" cy="226" rx="11" ry="6" fill="#6B3E5E"/>
    </svg>
  </div>
  <script src="i18n-en.js"></script>
  <script src="i18n.js"></script>
  <script src="buddy.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Notiță</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="sticky.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.8 1.8-1.7 0-1.2-1-1.5-1-2.5 0-.9.7-1.5 1.7-1.5h2A4 4 0 0 0 20.5 11 8 8 0 0 0 12 3.5z"/><circle cx="7.8" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/></symbol>
      <symbol id="i-top" viewBox="0 0 24 24"><path d="M9 3.5h6l-1 5 3.5 3.5h-11L10 8.5z"/><path d="M12 12v8.5"/></symbol>
      <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></symbol>
      <symbol id="i-max" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    </defs>
  </svg>

  <div class="paper" id="paper" data-color="ivory" data-deco="tape">
    <div class="tape"></div>
    <div class="pin"></div>
    <svg class="clip" viewBox="0 0 24 60"><path d="M8 50V12a4 4 0 0 1 8 0v34a6.5 6.5 0 0 1-13 0V16"/></svg>

    <div class="grab" title="Trage ca să muți"></div>
    <header>
      <input id="title" placeholder="Titlu…" maxlength="80" spellcheck="false">
      <div class="tools">
        <button id="btnNew" title="Notiță nouă"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="btnStyle" title="Culoare și decor"><svg class="ic"><use href="#i-palette"/></svg></button>
        <button id="btnTop" title="Mereu deasupra"><svg class="ic"><use href="#i-top"/></svg></button>
        <button id="btnCollapse" title="Restrânge"><svg class="ic"><use id="collapseIcon" href="#i-min"/></svg></button>
        <button id="btnClose" title="Dezlipește de pe desktop (notița rămâne în panou)"><svg class="ic"><use href="#i-close"/></svg></button>
      </div>
    </header>
    <textarea id="body" placeholder="Scrie aici…" spellcheck="false"></textarea>
    <footer>
      <span id="date"></span>
      <span class="grip" id="grip" title="Trage ca să redimensionezi"></span>
    </footer>

    <div class="popover hidden" id="popover">
      <div class="label">Hârtie</div>
      <div class="swatches" id="swatches"></div>
      <div class="label">Decor</div>
      <div class="decos" id="decos"></div>
      <button class="delete" id="btnDelete"><svg class="ic"><use href="#i-trash"/></svg>Șterge notița</button>
    </div>
  </div>
  <script src="sticky.js"></script>
</body>
</html>

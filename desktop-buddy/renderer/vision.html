<!DOCTYPE html>
<html lang="ro" data-theme="ivory">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
  <title>Vision board</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="vision.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-img" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6.5h14M12 6.5v12M9 18.5h6"/></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v7.5h14V12"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
    </defs>
  </svg>
  <header class="bar">
    <div class="monogram">M</div>
    <div class="titles">
      <input id="title" maxlength="60" spellcheck="false">
      <input id="subtitle" maxlength="100" spellcheck="false">
    </div>
    <div class="tools">
      <button id="addImg"><svg class="ic"><use href="#i-img"/></svg>Imagini</button>
      <button id="addText"><svg class="ic"><use href="#i-text"/></svg>Text</button>
      <button id="export" class="primary"><svg class="ic"><use href="#i-export"/></svg>Exportă</button>
      <button id="close" class="icon" title="Închide"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
  </header>
  <main id="board" class="board"></main>
  <div class="empty hidden" id="empty">
    <p class="big">Vizualizează anul tău.</p>
    <p>Adaugă fotografii (sau trage-le aici din Explorer): locuri, stiluri, obiective, oameni care te inspiră. Apoi completează cu cuvinte-cheie.</p>
  </div>
  <div class="drop hidden" id="drop">Lasă imaginile aici</div>
  <div class="toast" id="toast"></div>
  <script src="vision.js"></script>
</body>
</html>
